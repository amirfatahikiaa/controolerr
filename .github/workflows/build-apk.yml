name: Build GP-Mapper APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache NDK and CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: ndk-27.0.12077973-cmake-3.22.1-v2

      - name: Install Android NDK and CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Print build environment
        run: |
          echo "=== Build Environment ==="
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK version: $(cat $ANDROID_HOME/ndk/27.0.12077973/source.properties | grep Pkg.Revision)"
          echo "CMake version: $(cat $ANDROID_HOME/cmake/3.22.1/source.properties | grep Pkg.Revision)"
          echo "========================="

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK
        run: |
          echo "=== APK Verification ==="
          find app/build/outputs/apk -type f -name "*.apk" -print
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "========================"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GP-Mapper-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build Release APK
        if: success()
        continue-on-error: true
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GP-Mapper-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
          if-no-files-found: ignore
